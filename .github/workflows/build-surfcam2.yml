name: Compilation de SurfCam 2 (refonte)

# À chaque envoi sur la branche de refonte : tests du cœur et de l'appli, compilation, puis publication de l'APK
# « SurfCam 2 » (identifiant à part, s'installe à côté de l'appli actuelle) dans la release « surfcam2-latest ».
on:
  push:
    branches: [claude/vibrant-gates-viyb5r]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-surfcam2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accepte les licences du SDK Android
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests et compilation
        run: ./gradlew --no-daemon :core:test testDebugUnitTest assembleDebug
      - name: Déplace le tag surfcam2-latest sur ce commit
        run: |
          git tag -f surfcam2-latest
          git push -f origin surfcam2-latest
      - name: Publie l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surfcam2-latest
          name: SurfCam 2 (refonte, version de test)
          prerelease: true
          body: "APK de test de la refonte, compilé depuis la branche claude/vibrant-gates-viyb5r. S'installe à côté de SurfCam (identifiant com.surfcam.app2)."
          files: app/build/outputs/apk/debug/app-debug.apk
